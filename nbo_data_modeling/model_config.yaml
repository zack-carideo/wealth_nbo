# =====================================================================
# Model evaluation config
#
# Input is whatever preprocess.py wrote. Switch `design` between flat
# and hazard; nothing else needs to change.
# =====================================================================

# Relative paths resolve against the directory holding THIS FILE, which is
# also what you get running `cd nbo_data_modeling && python model.py`.
io:
  # Point at one of the files in model_data/.
  input_path:  "../outputs/model_data/hazard_dataset.csv"
  output_dir:  "../outputs/model_output"

# flat   = one row per customer, label column, direct evaluation.
# hazard = one row per customer-interval; per-interval hazards are
#          combined into a survival probability so the two designs are
#          scored on the same customer-level footing.
design: "hazard"

columns:
  id:     "customer"
  group:  "customer"          # CV folds split on this. Never split by row.
  # Label column differs by design: flat writes "label", hazard "event".
  label:  "event"
  # Row weight. Use exposure_frac on hazard so partial intervals count
  # for less. Set to null for flat.
  weight: "exposure_frac"
  # Never enter the model: identifiers, dates, bookkeeping.
  drop:   ["anchor_date", "months_low", "months_high"]
  # Numeric columns to treat as categorical. The hazard interval index
  # belongs here: it is the baseline hazard, not a linear trend.
  force_categorical: ["interval"]

encoding:
  # One-hot levels rarer than this are pooled into an "infrequent" bin.
  min_category_frequency: 0.01
  # Add a 0/1 was-missing flag beside every imputed numeric column.
  add_missing_indicators: true

model:
  # "logistic" or "gbm"
  type: "logistic"

  logistic:
    # Elastic net. Low l1_ratio keeps weak features shrunk rather than
    # dropped, which behaves better than hard selection at low event
    # counts.
    l1_ratio: 0.1
    c_grid: [0.001, 0.01, 0.1, 1.0]
    max_iter: 400
    tol: 0.001

  gbm:
    max_depth: 3
    learning_rate: 0.05
    max_iter: 300
    min_samples_leaf: 200
    l2_regularization: 1.0
    permutation_repeats: 5

sampling:
  # Fraction of non-converting customers to keep. 1.0 uses all of them.
  # Whole customers are sampled, never rows. Retained negatives are
  # weighted up by 1/fraction so totals match the full population.
  negative_customer_fraction: 0.25

cv:
  n_splits: 5
  n_repeats: 2
  random_state: 42

evaluation:
  # Report lift at these top-scoring fractions of the population.
  lift_at: [0.01, 0.05, 0.10]
  # Number of probability bins in the calibration table.
  calibration_bins: 5
  # hazard design only: horizon over which per-interval hazards are
  # combined into P(convert by H). Must be a multiple of the bin width
  # used in preprocessing.
  hazard_horizon_months: 24
  hazard_bin_months: 6
